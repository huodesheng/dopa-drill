<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1024" height="1024" viewBox="267 306 1300 1300" role="img" aria-labelledby="title desc">
  <title id="title">噜噜 — 左右对称·正面</title>
  <desc id="desc">噜噜（lulu）的分层矢量稿。正面、左右对称、平涂、粗轮廓。黄身体、橘鼻、蓝眼睛、头顶一颗橘子、橘色短裤、三趾脚。脚、手臂、手、身体、短裤、头、双耳、脸、双眼、眉、嘴各自成层。</desc>
  <metadata>Palette: body #FFD15A; muzzle #FF9A32; shorts #FF7A12; fruit #FF8A1A; feet #FFD15A; iris #3B7CFF; stem #3FA34D; outline #000000. Stroke width 4.5. Rest pose, both arms down, so the game can raise a hand. Same viewBox and layer ids as docs/dopakichi.svg.</metadata>
